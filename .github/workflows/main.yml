name: Build Miftah Ul Lughah APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -o MiftahUlLughah_Project.zip -d .

      - name: Fix missing import
        run: |
          sed -i '/^package .*;/a import android.graphics.drawable.GradientDrawable;' MiftahUlLughah/app/src/main/java/com/miftahullughah/app/MainActivity.java

      - name: Build APK
        run: |
          cd MiftahUlLughah
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miftah-Ul-Lughah-APK
          path: MiftahUlLughah/app/build/outputs/apk/debug/*.apk
